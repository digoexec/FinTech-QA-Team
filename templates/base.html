<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTech - Gestão Financeira</title>
    <style>
        :root {
            --bg-body: #070d19;
            --bg-card: #111827;
            --bg-input: #1f2937;
            --border-color: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .dashboard-wrapper {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            align-self: flex-start;
            margin-top: 40px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .logo-icon {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            font-weight: bold;
            font-size: 22px;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-text span {
            color: var(--accent-cyan);
        }

        h2 { margin: 0 0 5px 0; font-size: 22px; }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        input:focus, select:focus { border-color: var(--accent-cyan); }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }

        .btn-primary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-primary:hover { background-color: var(--bg-input); }

        .demo-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 20px;
        }

        .flash-messages { margin-bottom: 20px; }
        .flash { padding: 10px; border-radius: 6px; font-size: 14px; text-align: center; }
        .flash.error { background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--accent-red); color: #fca5a5; }
        .flash.success { background-color: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent-green); color: #6ee7b7; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
